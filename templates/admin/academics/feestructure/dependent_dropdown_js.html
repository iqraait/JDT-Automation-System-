<script>
(function() {
    function initDependentDropdowns() {
        var $ = (window.django && window.django.jQuery) ? window.django.jQuery : (window.jQuery || null);
        if (!$) return;

        var $institute = $('#id_institute');
        var $academicYear = $('#id_academic_year');
        var $course = $('#id_course');
        var $classObj = $('#id_class_obj');
        var $classYear = $('#id_class_year');

        if (!$institute.length) return;

        function setSelectState($select, items, selectedValue, placeholder, isDisabled) {
            if (!$select || !$select.length) return;

            $select.empty();
            $select.append(new Option(placeholder || '---------', '', false, false));

            if (items && items.length > 0) {
                var valToSet = (selectedValue !== undefined && selectedValue !== null) ? String(selectedValue) : '';
                var found = false;
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var isSel = (valToSet !== '' && String(item.id) === valToSet);
                    if (isSel) found = true;
                    $select.append(new Option(item.name, item.id, isSel, isSel));
                }
                if (!found) {
                    $select.val('');
                } else {
                    $select.val(valToSet);
                }
            } else {
                $select.val('');
            }

            $select.prop('disabled', !!isDisabled);

            // Notify Select2 to rebuild its UI
            try {
                $select.trigger('change.select2');
            } catch(e) {}
        }

        function loadOptionsForInstitute(preserveCurrent) {
            var instId = $institute.val();
            var ayId = $academicYear.val();

            if (!instId && !ayId) {
                setSelectState($course, [], '', '---------', false);
                setSelectState($classObj, [], '', '---------', false);
                setSelectState($classYear, [], '', '---------', false);
                return;
            }

            var currentAY = preserveCurrent ? $academicYear.val() : '';
            var currentCourse = preserveCurrent ? $course.val() : '';
            var currentClassObj = preserveCurrent ? $classObj.val() : '';
            var currentClassYear = preserveCurrent ? $classYear.val() : '';

            // Show loading indicator in dropdowns while fetching
            setSelectState($course, [], '', 'Loading courses...', true);
            setSelectState($classObj, [], '', 'Loading classes...', true);
            setSelectState($classYear, [], '', 'Loading class years...', true);

            var url = '/admin/academics/feestructure/api/options/?';
            if (instId) url += 'institute_id=' + encodeURIComponent(instId) + '&';
            if (ayId) url += 'academic_year_id=' + encodeURIComponent(ayId) + '&';
            if (currentCourse) url += 'course_id=' + encodeURIComponent(currentCourse) + '&';
            if (currentClassObj) url += 'class_id=' + encodeURIComponent(currentClassObj);

            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.academic_years && data.academic_years.length > 0) {
                        setSelectState($academicYear, data.academic_years, currentAY, '---------', false);
                    }
                    setSelectState($course, data.courses || [], currentCourse, '---------', false);
                    setSelectState($classObj, data.classes || [], currentClassObj, '---------', false);
                    setSelectState($classYear, data.class_years || [], currentClassYear, '---------', false);
                })
                .catch(function(err) {
                    console.error('Error fetching institute options:', err);
                    setSelectState($course, [], '', '---------', false);
                    setSelectState($classObj, [], '', '---------', false);
                    setSelectState($classYear, [], '', '---------', false);
                });
        }

        function onCourseChange() {
            var instId = $institute.val();
            var courseId = $course.val();

            if (!instId && !courseId) return;

            var currentClassObj = $classObj.val();
            var currentClassYear = $classYear.val();

            setSelectState($classObj, [], '', 'Loading classes...', true);
            setSelectState($classYear, [], '', 'Loading class years...', true);

            var url = '/admin/academics/feestructure/api/options/?';
            if (instId) url += 'institute_id=' + encodeURIComponent(instId) + '&';
            if (courseId) url += 'course_id=' + encodeURIComponent(courseId);

            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    setSelectState($classObj, data.classes || [], currentClassObj, '---------', false);
                    setSelectState($classYear, data.class_years || [], currentClassYear, '---------', false);
                })
                .catch(function() {
                    setSelectState($classObj, [], '', '---------', false);
                    setSelectState($classYear, [], '', '---------', false);
                });
        }

        function onClassObjChange() {
            var instId = $institute.val();
            var courseId = $course.val();
            var classId = $classObj.val();

            var currentClassYear = $classYear.val();

            setSelectState($classYear, [], '', 'Loading class years...', true);

            var url = '/admin/academics/feestructure/api/options/?';
            if (instId) url += 'institute_id=' + encodeURIComponent(instId) + '&';
            if (courseId) url += 'course_id=' + encodeURIComponent(courseId) + '&';
            if (classId) url += 'class_id=' + encodeURIComponent(classId);

            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    setSelectState($classYear, data.class_years || [], currentClassYear, '---------', false);
                })
                .catch(function() {
                    setSelectState($classYear, [], '', '---------', false);
                });
        }

        // Bind jQuery change listeners (intercepts Select2 events reliably)
        $(document).on('change', '#id_institute', function() {
            loadOptionsForInstitute(false);
        });

        $(document).on('change', '#id_academic_year', function() {
            if (!$institute.val()) {
                loadOptionsForInstitute(false);
            }
        });

        $(document).on('change', '#id_course', function() {
            onCourseChange();
        });

        $(document).on('change', '#id_class_obj', function() {
            onClassObjChange();
        });

        // Trigger initial filtering if values are pre-selected on page load
        if ($institute.val() || $academicYear.val()) {
            loadOptionsForInstitute(true);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDependentDropdowns);
    } else {
        initDependentDropdowns();
    }
})();
</script>
